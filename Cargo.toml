[package]
name = "botgek"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["Eray"]
license = "MIT"
description = "Modern Discord link dönüştürücü botu (Twitter/X, TikTok, Instagram, Reddit, Bluesky, WebUI, AI)"

[dependencies]
serenity = { version = "0.12", default-features = false, features = [
    "client",
    "gateway",
    "native_tls_backend",
    "model",
    "builder",
    "cache",
    "http"
] }
tokio = { version = "1.38", features = [
    "macros",
    "rt-multi-thread",
    "signal",
    "time",
    "net",
    "sync"
] }
regex = "1.10"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "http2",
    "gzip",
    "stream"
] }
# Reddit videolarını (video-only + ses-only CMAF) **sesli tek MP4**'e birleştirmek için saf Rust
# HLS motoru: `hls-transmux` 0.10 (çok-izli oturum API'si `MultiTrackInputs`/`MultiTrackSession`:
# video varyantı + ayrı `EXT-X-MEDIA TYPE=AUDIO` ses playlist'i tek oturumda `with_audio` ile birleşir).
# Not: eski tek-girdili `transmux_hls_to_mp4_bytes` kolaylık girişi ses rendition'ını çözmediği için
# bilinçli olarak çok-izli oturum kullanılır.
# `default-source` kapalı: HTTP kaynağı kendi reqwest istemcimizle sağlanır (ikinci bir reqwest
# sürümü/TLS yığını indirilmez). Yeniden kodlama yapılmaz; yalnızca konteyner yeniden yazılır.
hls-transmux = { version = "0.10", default-features = false }
url = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
axum = "0.7"
rusqlite = { version = "0.40.2", features = ["bundled"] }
urlencoding = "2.1.3"
getrandom = "0.4"
subtle = "2"

# Serenity 0.12's rustls gateway pins vulnerable webpki 0.102. Use its supported
# native backend until upstream upgrades the gateway; keep our HTTP on Rustls.
# Vendored OpenSSL makes Linux/ARM cross builds independent of host libssl headers.
[target.'cfg(unix)'.dependencies]
native-tls = { version = "0.2", features = ["vendored"] }

[package.metadata.deb]
name = "botgek"
maintainer = "Eray"
copyright = "2026 Eray"
extended-description = """\
Modern Discord link converter bot for Twitter/X, TikTok, Instagram, Reddit, Bluesky \
with WebUI control panel, role filtering, and sarcastic OpenRouter AI chat."""
depends = "libc6, ca-certificates"
section = "net"
priority = "optional"
assets = [
    ["target/release/botgek", "usr/bin/botgek", "755"],
    ["botgek.service", "lib/systemd/system/botgek.service", "644"],
    [".env.example", "etc/botgek/botgek.env.example", "640"],
]

# Geliştirme/test derlemeleri: hata ayıklama bilgisi **yalnızca satır tabloları** ile sınırlanır.
# Geri izlemeler (backtrace) dosya/satır bilgisiyle çalışmaya devam eder, ama `target/` hacmi
# ve bağlama (link) süresi belirgin biçimde küçülür (tam debug bilgisi gigabaytlara çıkıyordu).
[profile.dev]
debug = "line-tables-only"

[profile.release]
opt-level = 3
# İnce LTO: çalışma zamanı hızı ile CI derleme süresi arasında dengeli seçim.
lto = "thin"
codegen-units = 16
# Panik = abort: ikili küçülür, yığın açma (unwind) maliyeti kalkar.
panic = "abort"
strip = true
