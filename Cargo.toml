[package]
name = "botgek"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["Eray"]
license = "MIT"
description = "Discord için sosyal medya bağlantı dönüştürücü: Components V2 kartları, yönetim paneli ve AI sohbeti"
repository = "https://github.com/zoltrons/botgek"
homepage = "https://github.com/zoltrons/botgek"
readme = "README.md"
keywords = ["discord", "bot", "twitter", "embed", "self-hosted"]

[dependencies]
serenity = { version = "0.12", default-features = false, features = [
    "client",
    "gateway",
    "native_tls_backend",
    "model",
    "builder",
    "cache",
    "http"
] }
tokio = { version = "1.38", features = [
    "macros",
    "rt-multi-thread",
    "signal",
    "time",
    "net",
    "sync"
] }
regex = "1.10"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Serenity ile aynı sürüm: tek reqwest derlenir; rustls sistem kök sertifikalarını kullanır.
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "rustls",
    "http2",
    "gzip",
    "stream"
] }
# Reddit videolarında video + ses rendition'larını tek MP4'te birleştirir (çok-izli oturum).
# `default-source` kapalı: HTTP kaynağı kendi reqwest istemcimizle sağlanır; yeniden kodlama yoktur.
hls-transmux = { version = "0.10", default-features = false }
url = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
axum = "0.8"
rusqlite = { version = "0.40.2", features = ["bundled"] }
urlencoding = "2.1.3"
getrandom = "0.4"
subtle = "2"

# Serenity 0.12'nin Rustls gateway arka ucu savunmasız rustls-webpki 0.102'yi sabitler; upstream
# güncellenene kadar native-TLS kullanılır. Botun kendi HTTP istemcileri Rustls 0.23'te kalır.
# Vendored OpenSSL, Linux/ARM çapraz derlemelerini host libssl başlıklarından bağımsız kılar.
[target.'cfg(unix)'.dependencies]
native-tls = { version = "0.2", features = ["vendored"] }

# Geri izlemeler dosya/satır bilgisiyle çalışsın, ancak `target/` hacmi ve link süresi küçük kalsın.
[profile.dev]
debug = "line-tables-only"

[profile.release]
opt-level = 3
# İnce LTO: çalışma zamanı hızı ile CI derleme süresi arasında denge.
lto = "thin"
codegen-units = 16
# Panik = unwind: tek bir görev paniği süreci (gateway + panel) öldürmesin.
strip = true
