[package]
name = "botgek"
version = "0.1.0"
edition = "2024"
authors = ["Eray"]
license = "MIT"
description = "Modern Discord link dönüştürücü botu (Twitter/X, TikTok, Instagram, Reddit, Bluesky, WebUI, AI)"

[dependencies]
serenity = { version = "0.12", default-features = false, features = [
    "client",
    "gateway",
    "rustls_backend",
    "model",
    "builder",
    "cache",
    "http"
] }
tokio = { version = "1.38", features = [
    "macros",
    "rt-multi-thread",
    "signal",
    "time",
    "net",
    "sync"
] }
regex = "1.10"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "http2",
    "gzip",
    "stream"
] }
# Reddit videolarını (video-only + ses-only CMAF) **sesli tek MP4**'e birleştirmek için saf Rust
# HLS motoru (`hls-engine` 1.0.1, 2026-10-08): `hls-transmux` motorunun **daha yeni** ve odaklanmış
# paketlemesidir; çok-izli API (`MultiTrackInputs`/`MultiTrackSession`) iki pakette de aynıdır, ancak
# hls-transmux 0.10'un *eski tek-girdili* kolaylık girişleri `EXT-X-MEDIA TYPE=AUDIO` grubunu çözmez.
# `default-source` kapalı: HTTP kaynağı kendi reqwest istemcimizle sağlanır (ikinci bir reqwest
# sürümü/TLS yığını indirilmez). Yeniden kodlama yapılmaz; yalnızca konteyner yeniden yazılır.
hls-engine = { version = "1.0", default-features = false }
url = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
axum = "0.7"
rusqlite = { version = "0.40.2", features = ["bundled"] }
urlencoding = "2.1.3"

[package.metadata.deb]
name = "botgek"
maintainer = "Eray"
copyright = "2026 Eray"
extended-description = """\
Modern Discord link converter bot for Twitter/X, TikTok, Instagram, Reddit, Bluesky \
with WebUI control panel, role filtering, and sarcastic OpenRouter AI chat."""
depends = "libc6, ca-certificates"
suggests = "ffmpeg"
section = "net"
priority = "optional"
assets = [
    ["target/release/botgek", "usr/bin/botgek", "755"],
    ["botgek.service", "lib/systemd/system/botgek.service", "644"],
    [".env.example", "etc/botgek/botgek.env.example", "640"],
]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
panic = "abort"
strip = true
