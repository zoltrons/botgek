[package]
name = "botgek"
version = "0.1.0"
edition = "2021"
authors = ["Eray"]
license = "MIT"
description = "Modern Discord link dönüştürücü botu (Twitter/X, TikTok, Instagram, Reddit, Bluesky, WebUI, AI)"

[dependencies]
serenity = { version = "0.12", default-features = false, features = [
    "client",
    "gateway",
    "rustls_backend",
    "model",
    "builder",
    "cache"
] }
tokio = { version = "1.38", features = ["macros", "rt-multi-thread", "signal"] }
regex = "1.10"
once_cell = "1.19"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
axum = "0.7"

[package.metadata.deb]
name = "botgek"
maintainer = "Eray"
copyright = "2026 Eray"
extended-description = """\
Modern Discord link converter bot for Twitter/X, TikTok, Instagram, Reddit, Bluesky \
with WebUI control panel, role filtering, and sarcastic OpenRouter AI chat."""
depends = "libc6, ca-certificates"
section = "net"
priority = "optional"
assets = [
    ["target/release/botgek", "usr/bin/botgek", "755"],
    ["botgek.service", "lib/systemd/system/botgek.service", "644"],
    [".env.example", "etc/botgek/botgek.env.example", "640"],
]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
panic = "abort"
strip = true

