name: Build and Release (Raspberry Pi, Linux & Docker)

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  # 1. Test Aşaması
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Cargo Test
        run: cargo test --verbose

  # 2. Raspberry Pi (Debian) ve Linux Derleme (Paralel Çalışır, test ile eşzamanlı)
  build-and-package:
    name: Build for ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
            arch: arm64
            deb_arch: arm64
            name: raspberry-pi-64bit-arm64
            use_cross: true
          - target: armv7-unknown-linux-gnueabihf
            arch: armhf
            deb_arch: armhf
            name: raspberry-pi-32bit-armhf
            use_cross: true
          - target: x86_64-unknown-linux-gnu
            arch: amd64
            deb_arch: amd64
            name: linux-x86_64-amd64
            use_cross: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install build tools (cross, cargo-deb)
        uses: taiki-e/install-action@v2
        with:
          tool: cross, cargo-deb

      - name: Compile Release Binary
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Package Debian (.deb)
        run: |
          cargo deb --target ${{ matrix.target }} --no-build --no-strip -o target/botgek_${{ matrix.deb_arch }}.deb

      - name: Create Tarball Archive (.tar.gz)
        run: |
          mkdir -p dist
          BIN_PATH="target/${{ matrix.target }}/release/botgek"
          
          PKG_DIR="botgek-${{ matrix.name }}"
          mkdir -p "$PKG_DIR"
          cp "$BIN_PATH" "$PKG_DIR/"
          cp botgek.service "$PKG_DIR/"
          cp .env.example "$PKG_DIR/"
          cp settings.json "$PKG_DIR/"
          cp README.md "$PKG_DIR/"
          
          tar -czvf "dist/botgek-${{ matrix.name }}.tar.gz" "$PKG_DIR"
          cp target/botgek_${{ matrix.deb_arch }}.deb dist/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: botgek-${{ matrix.name }}
          path: dist/*
          retention-days: 30

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 3. Ultra-Hızlı Multi-Arch Docker İmajı Paketleme (QEMU emülasyonsuz ~30sn)
  docker-publish:
    name: Publish Multi-Arch Docker Image
    needs: [test, build-and-package]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Organize binaries for Buildx
        run: |
          mkdir -p bin/amd64 bin/arm64 bin/armv7
          
          tar -xzvf botgek-linux-x86_64-amd64/botgek-linux-x86_64-amd64.tar.gz
          cp botgek-linux-x86_64-amd64/botgek bin/amd64/

          tar -xzvf botgek-raspberry-pi-64bit-arm64/botgek-raspberry-pi-64bit-arm64.tar.gz
          cp botgek-raspberry-pi-64bit-arm64/botgek bin/arm64/

          tar -xzvf botgek-raspberry-pi-32bit-armhf/botgek-raspberry-pi-32bit-armhf.tar.gz
          cp botgek-raspberry-pi-32bit-armhf/botgek bin/armv7/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Build and push Multi-Arch Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.prebuilt
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
