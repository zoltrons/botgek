name: Build and Release (Raspberry Pi, Linux & Docker)

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

# Gereksiz tekrar eden çalıştırmaları iptal et (main, master ve release tag'leri hariç)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' && !startsWith(github.ref, 'refs/tags/v') }}

# GitHub Security Best Practice (En Az Yetki İlkesi / Least Privilege)
permissions:
  contents: read

jobs:
  # 1. Test Aşaması — aynı zamanda **sürüm künyesinin kaynağı**: paket dosya adları ve
  # doğrulama, derlenmiş ikilinin kendi `--version` çıktısından beslenir (kopya mantık yok).
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_file: ${{ steps.version.outputs.version_file }}
      summary: ${{ steps.version.outputs.summary }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Sürüm git etiketlerinden türetilir (`build.rs`): etiketler + tam geçmiş gerekir.
          fetch-depth: 0

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Cargo Test
        run: cargo test --verbose --locked

      - name: Sürüm künyesi (derlenmiş ikiliden)
        id: version
        env:
          BOTGEK_BUILD_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          BOTGEK_GIT_SHA: ${{ github.sha }}
        run: |
          set -eu
          summary="$(cargo run --quiet -- --version)"
          echo "$summary"
          version="$(printf '%s' "$summary" | awk '{print $2}')"
          version="${version#v}"
          echo "summary=$summary" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version_file=$(printf '%s' "$version" | tr '+' '_')" >> "$GITHUB_OUTPUT"
          echo "sürüm: $version"

  # 2. Raspberry Pi (Debian) ve Linux Derleme (üç hedef paralel; testler geçtikten sonra)
  build-and-package:
    name: Build for ${{ matrix.name }}
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
            arch: arm64
            deb_arch: arm64
            name: raspberry-pi-64bit-arm64
            use_cross: true
          - target: armv7-unknown-linux-gnueabihf
            arch: armhf
            deb_arch: armhf
            name: raspberry-pi-32bit-armhf
            use_cross: true
          - target: x86_64-unknown-linux-gnu
            arch: amd64
            deb_arch: amd64
            name: linux-x86_64-amd64
            use_cross: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Sürüm etiketten türetilir: etiketler + tam geçmiş gerekir.
          fetch-depth: 0

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install build tools (cross, cargo-deb)
        uses: taiki-e/install-action@v2
        with:
          tool: cross, cargo-deb

      - name: Compile Release Binary
        env:
          # Sürüm künyesi ikiliye gömülür: tag'de etiket adı, dalda tam geçmişten `git describe`.
          BOTGEK_BUILD_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          BOTGEK_GIT_SHA: ${{ github.sha }}
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Doğrula — sürüm ikiliye gömülmüş (yalnızca ana makine hedefi)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          set -eu
          BIN="target/${{ matrix.target }}/release/botgek"
          "$BIN" --version
          if [ "${{ github.ref_type }}" = "tag" ]; then
            "$BIN" --version | grep -q "v${{ needs.test.outputs.version }}" \
              || { echo "hata: etiket sürümü (${{ needs.test.outputs.version }}) ikiliye gömülmemiş" >&2; exit 1; }
          fi

      - name: Package Debian (.deb)
        run: |
          cargo deb --target ${{ matrix.target }} --no-build --no-strip \
            -o "target/botgek_${{ needs.test.outputs.version_file }}_${{ matrix.deb_arch }}.deb"

      - name: Create Tarball Archive (.tar.gz)
        run: |
          set -eu
          mkdir -p dist
          BIN_PATH="target/${{ matrix.target }}/release/botgek"

          # Paket dizini sürümden **bağımsız** kalır (docker işi bu adı kullanır);
          # arşiv/deb dosya adları sürümü taşır.
          PKG_DIR="botgek-${{ matrix.name }}"
          mkdir -p "$PKG_DIR"
          cp "$BIN_PATH" "$PKG_DIR/"
          cp botgek.service "$PKG_DIR/"
          cp .env.example "$PKG_DIR/"
          cp settings.json "$PKG_DIR/"
          cp README.md "$PKG_DIR/"
          if [ -f "deploy-rpi.sh" ]; then
            cp deploy-rpi.sh "$PKG_DIR/"
            chmod +x "$PKG_DIR/deploy-rpi.sh"
          fi

          tar -czvf "dist/botgek-${{ needs.test.outputs.version_file }}-${{ matrix.name }}.tar.gz" "$PKG_DIR"
          cp "target/botgek_${{ needs.test.outputs.version_file }}_${{ matrix.deb_arch }}.deb" dist/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: botgek-${{ matrix.name }}
          path: dist/*
          retention-days: 30

  # 3. GitHub Release Yayınlama (Tüm mimariler derlendikten sonra tekil ve yarış durumsuz çalışır)
  release:
    name: Publish GitHub Release
    needs: [test, build-and-package]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: botgek-*
          path: dist
          merge-multiple: true

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.deb
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 4. Ultra-Hızlı Multi-Arch Docker İmajı Paketleme (QEMU emülasyonsuz ~30sn)
  docker-publish:
    name: Publish Multi-Arch Docker Image
    needs: [test, build-and-package]
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # `docker/metadata-action` semver etiketini buradan okur.
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: botgek-*
          path: dist
          merge-multiple: true

      - name: Organize binaries for Buildx
        run: |
          set -eu
          VERSION="${{ needs.test.outputs.version_file }}"
          mkdir -p bin/amd64 bin/arm64 bin/armv7

          tar -xzvf "dist/botgek-${VERSION}-linux-x86_64-amd64.tar.gz"
          cp botgek-linux-x86_64-amd64/botgek bin/amd64/

          tar -xzvf "dist/botgek-${VERSION}-raspberry-pi-64bit-arm64.tar.gz"
          cp botgek-raspberry-pi-64bit-arm64/botgek bin/arm64/

          tar -xzvf "dist/botgek-${VERSION}-raspberry-pi-32bit-armhf.tar.gz"
          cp botgek-raspberry-pi-32bit-armhf/botgek bin/armv7/

          chmod +x bin/amd64/botgek bin/arm64/botgek bin/armv7/botgek

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Build and push Multi-Arch Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.prebuilt
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max' || '' }}
