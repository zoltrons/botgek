name: Build and Release (Raspberry Pi, Linux & Docker)

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
    # Yalnızca belge değiştiren PR'lar tam CI (test + arm64 derleme + imaj) çalıştırmasın.
    paths-ignore:
      - "**.md"
      - "LICENSE"
  # `release.yml` bu workflow'u etiket ref'inde (`--ref vX.Y.Z`) başlatır: `github.ref` yine `refs/tags/v...` olduğundan etiket koşulları push'taki gibi çalışır.
  workflow_dispatch:

# Gereksiz tekrar eden çalıştırmaları iptal et (main, master ve release tag'leri hariç)
concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' && !startsWith(github.ref, 'refs/tags/v') }}

# GitHub Security Best Practice (En Az Yetki İlkesi / Least Privilege)
permissions:
  contents: read

jobs:
  # 1. Test Aşaması — aynı zamanda **sürüm künyesinin kaynağı**: paket dosya adları ve
  # doğrulama, derlenmiş ikilinin kendi `--version` çıktısından beslenir (kopya mantık yok).
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version_file: ${{ steps.version.outputs.version_file }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Sürüm git etiketlerinden türetilir (`build.rs`): etiketler + tam geçmiş gerekir.
          fetch-depth: 0

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          # Actions cache'i depo başına ayrı 10 GB'dır (artefakt/paket kotasından bağımsız):
          # `target/` de önbelleğe alınır ki her koşu ~300 crate'ı yeniden derlemesin.
          # İş türü başına ayrı anahtar: test (debug) ve sürüm derlemelerinin `target/` içerikleri birbirini ezmesin.
          add-job-id-key: "false"
          shared-key: "test"
          # Ana dalın cache'i tüm dallara ve etiketlere açıktır; etiket/PR koşularının ürettiği cache'i kimse kullanamaz.
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
          # Ana dalda başarısız bir koşu da cache'i kaydetsin: sonraki koşu aynı ~300 crate'i baştan derlemesin.
          cache-on-failure: true

      # Biçim denetimi derleme gerektirmez: testlerden önce koşar ki biçim hatası hızlı düşsün.
      - name: Format check
        run: cargo fmt --all --check

      - name: Run Cargo Test
        # `--verbose` yok: test çıktısı aynı bilgiyi verir, log aktarımı küçülür.
        run: cargo test --locked

      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Setup Node for dependency-free panel tests
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Panel syntax and behavior
        run: |
          node --check src/web/ui/app.js
          node --check src/web/ui/login.js
          node --test tests/web-ui.test.cjs

      - name: Sürüm künyesi (derlenmiş ikiliden)
        id: version
        env:
          BOTGEK_BUILD_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          BOTGEK_GIT_SHA: ${{ github.sha }}
        run: |
          set -eu
          summary="$(cargo run --locked --quiet -- --version)"
          echo "$summary"
          version="$(printf '%s' "$summary" | awk '{print $2}')"
          version="${version#v}"
          echo "summary=$summary" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version_file=$(printf '%s' "$version" | tr '+' '_')" >> "$GITHUB_OUTPUT"
          echo "sürüm: $version"

  # 2. Raspberry Pi 64-bit (arm64) derleme ve paketleme (testler geçtikten sonra).
  # Tek hedef kaldığı için matris yerine düz iş: armhf/x86_64 derlemelerini tüketen bir şey yok.
  build-and-package:
    name: Build arm64 package
    needs: [test]
    runs-on: ubuntu-latest
    # Soğuk cache'te çapraz derleme (QEMU + vendored OpenSSL/SQLite + LTO) uzun sürebilir;
    # üst sınır yalnızca asılı kalan işleri keser.
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Sürüm etiketten türetilir: etiketler + tam geçmiş gerekir.
          fetch-depth: 0

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
          toolchain: 1.98.1

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          # Sürüm derlemesinin kendi `target/` cache'i: arm64 sürüm derlemesi (vendored OpenSSL, bundled SQLite, LTO) her koşuda sıfırdan yapılmasın.
          add-job-id-key: "false"
          shared-key: "release-aarch64-unknown-linux-gnu"
          # Ana dalın cache'i etiket koşularına da açıktır; yayın derlemesi onu geri yükler.
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
          cache-on-failure: true

      - name: Install build tools (cross)
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Compile Release Binary
        env:
          # Sürüm künyesi ikiliye gömülür: tag'de etiket adı, dalda tam geçmişten `git describe`.
          BOTGEK_BUILD_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          BOTGEK_GIT_SHA: ${{ github.sha }}
        run: cross build --locked --release --target aarch64-unknown-linux-gnu

      - name: Doğrula — glibc sembol sürümleri bookworm (2.36) ile uyumlu
        env:
          MAX_GLIBC: "2.36"
          BIN: target/aarch64-unknown-linux-gnu/release/botgek
        run: |
          set -euo pipefail
          # `readelf` mimariden bağımsızdır (çapraz derlenmiş arm ikililerini de okur); yoksa ana makinenin `objdump`'ı denenir.
          if command -v readelf >/dev/null 2>&1; then
            dump="$(readelf -W --version-info --dyn-syms "$BIN")"
          elif command -v objdump >/dev/null 2>&1; then
            dump="$(objdump -T "$BIN")"
          else
            echo "::warning::readelf/objdump bulunamadı; glibc denetimi atlandı"
            exit 0
          fi
          newest="$(printf '%s\n' "$dump" | grep -oE 'GLIBC_[0-9]+(\.[0-9]+)+' | sed 's/^GLIBC_//' | sort -uV | tail -n 1 || true)"
          if [ -z "$newest" ]; then
            echo "::error::$BIN içinde GLIBC sembol sürümü bulunamadı (statik ya da okunamayan ikili?)"
            exit 1
          fi
          echo "en yeni glibc sembolü: GLIBC_$newest (üst sınır: GLIBC_$MAX_GLIBC)"
          if [ "$(printf '%s\n%s\n' "$newest" "$MAX_GLIBC" | sort -V | tail -n 1)" != "$MAX_GLIBC" ]; then
            echo "::error::$BIN GLIBC_$newest istiyor; bookworm (glibc $MAX_GLIBC) üzerinde çalışmaz"
            exit 1
          fi

      - name: Create Tarball Archive (.tar.gz)
        run: |
          set -eu
          mkdir -p dist
          BIN_PATH="target/aarch64-unknown-linux-gnu/release/botgek"

          # Paket dizini sürümden **bağımsız** kalır (docker işi bu adı kullanır);
          # arşiv adı sürümü taşır.
          PKG_DIR="botgek-raspberry-pi-64bit-arm64"
          mkdir -p "$PKG_DIR"
          cp "$BIN_PATH" "$PKG_DIR/"
          cp .env.example "$PKG_DIR/"
          cp settings.json "$PKG_DIR/"
          cp README.md "$PKG_DIR/"

          tar -czvf "dist/botgek-${{ needs.test.outputs.version_file }}-raspberry-pi-64bit-arm64.tar.gz" "$PKG_DIR"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: botgek-raspberry-pi-64bit-arm64
          path: dist/*
          # Artefaktlar yalnızca **aynı koşu içinde** (release + docker işleri) tüketilir:
          # 30 günlük saklama gereksiz yer tutuyordu.
          retention-days: 1

  # 3. GitHub Release Yayınlama (paket derlendikten sonra tekil ve yarış durumsuz çalışır)
  release:
    name: Publish GitHub Release
    needs: [build-and-package]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: botgek-*
          path: dist
          merge-multiple: true

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
          generate_release_notes: true
          # `v1.0.0-rc.1` gibi tireli etiketler ön sürümdür.
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 4. arm64 Docker İmajı Paketleme (hazır ikiliden)
  docker-publish:
    name: Publish Docker Image (arm64)
    needs: [build-and-package]
    # `main` push'u ve main'den elle başlatma `latest`'i taşır; sürüm etiketi `X.Y.Z` + `latest`
    # yayınlar. PR'lar ve özellik dalından elle başlatma imajı yalnızca **derler** (push yok).
    # İmaj, GitHub'ın **yerel arm64** runner'ında derlenir: `Dockerfile.prebuilt` içindeki `apt-get`
    # QEMU altında ~67 sn sürüyordu; yerel arm64'te aynı katman birkaç saniyede biter ve QEMU
    # kurulum/kaldırma adımı (asılı kalabilen post adımı) tamamen kalkar.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        # Varsayılan derinlik yeterli: `docker/metadata-action` semver etiketini `github.ref`'ten okur.

      - name: Download packaged binary
        uses: actions/download-artifact@v4
        with:
          name: botgek-raspberry-pi-64bit-arm64
          path: dist

      - name: Organize binaries for Buildx
        run: |
          set -eu
          mkdir -p bin/arm64
          tar -xzvf dist/botgek-*-raspberry-pi-64bit-arm64.tar.gz
          cp botgek-raspberry-pi-64bit-arm64/botgek bin/arm64/
          chmod +x bin/arm64/botgek

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # `latest` yalnızca aşağıdaki açık kuralla gelir; otomatik `latest` kapalı.
          flavor: |
            latest=false
          tags: |
            # Yalnızca sürüm etiketi + `latest`. `type=sha` **kaldırıldı**: her `main` push'u
            # yeni bir paket sürümü (`sha-xxxxxxx`) üretiyordu.
            # Artık her yayın **tek** paket sürümü olur: etiketler `X.Y.Z` + `latest`.
            # Ön sürüm etiketi (`v1.0.0-rc.1`, tire içerir) `latest`'i taşımaz.
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
            type=semver,pattern={{version}}

      - name: Build and push Docker Image (arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.prebuilt
          platforms: linux/arm64
          # Sürüm etiketi ve ana dal dışında (ör. özellik dalından elle başlatma) `latest` taşınmasın.
          push: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Buildx cache'i **kapalı**: imajın tek pahalı katmanı `apt-get`; yerel arm64'te bu
          # katman birkaç saniye sürdüğü için cache dışa aktarmanın (~10 MB ikili katmanı her
          # koşuda yeniden yazar) maliyeti kazancını geçiyor. `mode=max` zaten kaldırılmıştı.
