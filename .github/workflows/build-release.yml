name: Build and Release (Raspberry Pi, Linux & Docker)

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  # `release.yml` bu workflow'u etiket ref'inde (`--ref vX.Y.Z`) başlatır: `github.ref` yine `refs/tags/v...` olduğundan etiket koşulları push'taki gibi çalışır.
  workflow_dispatch:

# Gereksiz tekrar eden çalıştırmaları iptal et (main, master ve release tag'leri hariç)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' && !startsWith(github.ref, 'refs/tags/v') }}

# GitHub Security Best Practice (En Az Yetki İlkesi / Least Privilege)
permissions:
  contents: read

jobs:
  # 1. Test Aşaması — aynı zamanda **sürüm künyesinin kaynağı**: paket dosya adları ve
  # doğrulama, derlenmiş ikilinin kendi `--version` çıktısından beslenir (kopya mantık yok).
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_file: ${{ steps.version.outputs.version_file }}
      summary: ${{ steps.version.outputs.summary }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Sürüm git etiketlerinden türetilir (`build.rs`): etiketler + tam geçmiş gerekir.
          fetch-depth: 0

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          # Depolama kotası (dahil 0,5 GB) hedef dizinlerini tutmaya yetmiyor: yalnızca
          # cargo kayıt defteri/git önbelleği alınır (bkz. build-and-package açıklaması).
          cache-targets: "false"
          # Tüm işler **tek** kayıt defteri cache'ini paylaşır: iş kimliği anahtara girmezse
          # (ve `shared-key` sabitse) 5 iş × ~400 MB yerine 1 cache oluşur.
          add-job-id-key: "false"
          shared-key: "rust-registry"
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') }}

      - name: Run Cargo Test
        run: cargo test --verbose --locked

      - name: Format and lint
        run: |
          cargo fmt --all --check
          cargo clippy --all-targets --locked -- -D warnings

      - name: Setup Node for dependency-free panel tests
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Panel syntax and behavior
        run: |
          node --check src/web/ui/app.js
          node --check src/web/ui/login.js
          node --test tests/web-ui.test.cjs

      - name: Sürüm künyesi (derlenmiş ikiliden)
        id: version
        env:
          BOTGEK_BUILD_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          BOTGEK_GIT_SHA: ${{ github.sha }}
        run: |
          set -eu
          summary="$(cargo run --locked --quiet -- --version)"
          echo "$summary"
          version="$(printf '%s' "$summary" | awk '{print $2}')"
          version="${version#v}"
          echo "summary=$summary" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version_file=$(printf '%s' "$version" | tr '+' '_')" >> "$GITHUB_OUTPUT"
          echo "sürüm: $version"

  # 2. Raspberry Pi (Debian) ve Linux Derleme (üç hedef paralel; testler geçtikten sonra)
  build-and-package:
    name: Build for ${{ matrix.name }}
    needs: [test]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
            arch: arm64
            deb_arch: arm64
            name: raspberry-pi-64bit-arm64
            use_cross: true
            runner: ubuntu-latest
          - target: armv7-unknown-linux-gnueabihf
            arch: armhf
            deb_arch: armhf
            name: raspberry-pi-32bit-armhf
            use_cross: true
            runner: ubuntu-latest
          # Yerel derleme ana makinenin glibc'sine bağlanır: ubuntu-latest (glibc 2.39) ikilisi bookworm imajında (glibc 2.36) `GLIBC_2.38 not found` ile açılmaz.
          # ubuntu-22.04 (glibc 2.35) bookworm ve daha eski Debian sürümleriyle uyumlu ikili üretir.
          - target: x86_64-unknown-linux-gnu
            arch: amd64
            deb_arch: amd64
            name: linux-x86_64-amd64
            use_cross: false
            runner: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Sürüm etiketten türetilir: etiketler + tam geçmiş gerekir.
          fetch-depth: 0

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          toolchain: 1.98.1

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          # Depolama kotası (dahil 0,5 GB) hedef dizinlerini tutmaya yetmiyor: yalnızca
          # cargo kayıt defteri/git önbelleği alınır (hedef başına 400-600 MB'lık target
          # cache'i birikiyordu). Derleme yeniden yapılır, depolama onlarca MB'ta kalır.
          cache-targets: "false"
          # Matris hedefi (`key`) **kaldırıldı**: `target/` cache'lenmediği için ayrıştırmaya
          # gerek yok; üç hedef + test + kapsam işleri tek paylaşımlı cache kullanır.
          add-job-id-key: "false"
          shared-key: "rust-registry"
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') }}

      - name: Install build tools (cross, cargo-deb)
        uses: taiki-e/install-action@v2
        with:
          tool: cross, cargo-deb

      - name: Compile Release Binary
        env:
          # Sürüm künyesi ikiliye gömülür: tag'de etiket adı, dalda tam geçmişten `git describe`.
          BOTGEK_BUILD_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          BOTGEK_GIT_SHA: ${{ github.sha }}
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --locked --release --target ${{ matrix.target }}
          else
            cargo build --locked --release --target ${{ matrix.target }}
          fi

      - name: Doğrula — glibc sembol sürümleri bookworm (2.36) ile uyumlu
        env:
          MAX_GLIBC: "2.36"
          BIN: target/${{ matrix.target }}/release/botgek
        run: |
          set -euo pipefail
          # `readelf` mimariden bağımsızdır (çapraz derlenmiş arm ikililerini de okur); yoksa ana makinenin `objdump`'ı denenir.
          if command -v readelf >/dev/null 2>&1; then
            dump="$(readelf -W --version-info --dyn-syms "$BIN")"
          elif command -v objdump >/dev/null 2>&1; then
            dump="$(objdump -T "$BIN")"
          else
            echo "::warning::readelf/objdump bulunamadı; glibc denetimi atlandı"
            exit 0
          fi
          newest="$(printf '%s\n' "$dump" | grep -oE 'GLIBC_[0-9]+(\.[0-9]+)+' | sed 's/^GLIBC_//' | sort -uV | tail -n 1 || true)"
          if [ -z "$newest" ]; then
            echo "::error::$BIN içinde GLIBC sembol sürümü bulunamadı (statik ya da okunamayan ikili?)"
            exit 1
          fi
          echo "en yeni glibc sembolü: GLIBC_$newest (üst sınır: GLIBC_$MAX_GLIBC)"
          if [ "$(printf '%s\n%s\n' "$newest" "$MAX_GLIBC" | sort -V | tail -n 1)" != "$MAX_GLIBC" ]; then
            echo "::error::$BIN GLIBC_$newest istiyor; bookworm (glibc $MAX_GLIBC) üzerinde çalışmaz"
            exit 1
          fi

      - name: Doğrula — sürüm ikiliye gömülmüş (yalnızca ana makine hedefi)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          set -eu
          BIN="target/${{ matrix.target }}/release/botgek"
          "$BIN" --version
          if [ "${{ github.ref_type }}" = "tag" ]; then
            "$BIN" --version | grep -q "v${{ needs.test.outputs.version }}" \
              || { echo "hata: etiket sürümü (${{ needs.test.outputs.version }}) ikiliye gömülmemiş" >&2; exit 1; }
          fi

      - name: Package Debian (.deb)
        run: |
          cargo deb --target ${{ matrix.target }} --no-build --no-strip \
            -o "target/botgek_${{ needs.test.outputs.version_file }}_${{ matrix.deb_arch }}.deb"

      - name: Create Tarball Archive (.tar.gz)
        run: |
          set -eu
          mkdir -p dist
          BIN_PATH="target/${{ matrix.target }}/release/botgek"

          # Paket dizini sürümden **bağımsız** kalır (docker işi bu adı kullanır);
          # arşiv/deb dosya adları sürümü taşır.
          PKG_DIR="botgek-${{ matrix.name }}"
          mkdir -p "$PKG_DIR"
          cp "$BIN_PATH" "$PKG_DIR/"
          cp botgek.service "$PKG_DIR/"
          cp .env.example "$PKG_DIR/"
          cp settings.json "$PKG_DIR/"
          cp README.md "$PKG_DIR/"
          if [ -f "deploy-rpi.sh" ]; then
            cp deploy-rpi.sh "$PKG_DIR/"
            chmod +x "$PKG_DIR/deploy-rpi.sh"
          fi

          tar -czvf "dist/botgek-${{ needs.test.outputs.version_file }}-${{ matrix.name }}.tar.gz" "$PKG_DIR"
          cp "target/botgek_${{ needs.test.outputs.version_file }}_${{ matrix.deb_arch }}.deb" dist/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: botgek-${{ matrix.name }}
          path: dist/*
          # Artefaktlar yalnızca **aynı koşu içinde** (release + docker işleri) tüketilir:
          # 30 günlük saklama kotayı dolduruyordu (219 artefakt ≈ 1,7 GB).
          retention-days: 1

  # 3. GitHub Release Yayınlama (Tüm mimariler derlendikten sonra tekil ve yarış durumsuz çalışır)
  release:
    name: Publish GitHub Release
    needs: [test, build-and-package]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: botgek-*
          path: dist
          merge-multiple: true

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.deb
          generate_release_notes: true
          # `v1.0.0-rc.1` gibi tireli etiketler ön sürümdür.
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 4. Ultra-Hızlı Multi-Arch Docker İmajı Paketleme (QEMU emülasyonsuz ~30sn)
  docker-publish:
    name: Publish Multi-Arch Docker Image
    needs: [test, build-and-package]
    # Yalnızca **sürüm etiketleri** imaj yayınlar; PR'lar imajı yalnızca **derler** (push yok).
    # `main` push'unda imaj üretilmez: her push'un `latest`/`sha-*` sürümü GHCR paket kotasını
    # dolduruyordu (bkz. `ghcr-cleanup.yml`). Böylece `latest` = son yayın sürümü olur.
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # `docker/metadata-action` semver etiketini buradan okur.
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: botgek-*
          path: dist
          merge-multiple: true

      - name: Organize binaries for Buildx
        run: |
          set -eu
          VERSION="${{ needs.test.outputs.version_file }}"
          mkdir -p bin/amd64 bin/arm64 bin/armv7

          tar -xzvf "dist/botgek-${VERSION}-linux-x86_64-amd64.tar.gz"
          cp botgek-linux-x86_64-amd64/botgek bin/amd64/

          tar -xzvf "dist/botgek-${VERSION}-raspberry-pi-64bit-arm64.tar.gz"
          cp botgek-raspberry-pi-64bit-arm64/botgek bin/arm64/

          tar -xzvf "dist/botgek-${VERSION}-raspberry-pi-32bit-armhf.tar.gz"
          cp botgek-raspberry-pi-32bit-armhf/botgek bin/armv7/

          chmod +x bin/amd64/botgek bin/arm64/botgek bin/armv7/botgek

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # `latest` yalnızca aşağıdaki açık kuralla gelir; otomatik `latest` kapalı.
          flavor: |
            latest=false
          tags: |
            # Yalnızca sürüm etiketi + `latest`. `type=sha` **kaldırıldı**: her `main` push'u
            # yeni bir paket sürümü (`sha-xxxxxxx`) üretiyor, eskiler etiketsiz kalıp hiç
            # silinmediği için GHCR paket kotasını (özel paketlerde 500 MB) dolduruyordu.
            # Artık her yayın **tek** paket sürümü olur: etiketler `X.Y.Z` + `latest`.
            # Ön sürüm etiketi (`v1.0.0-rc.1`, tire içerir) `latest`'i taşımaz.
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
            type=semver,pattern={{version}}

      - name: Build and push Multi-Arch Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.prebuilt
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Buildx GHA cache'i **kapalı**: `type=gha,mode=max` depolamanın en büyük kalemiydi
          # (70 buildkit cache girdisi). İmaj hazır ikililerden ~30 sn'de derlendiği için
          # cache'e gerek yok; imaj katmanları GHCR'de (Paketler) tutulur, Actions kotasında değil.
