name: Actions depolama temizliği

# Artefaktlar 0,5 GB'lık hesap depolama kotasına sayılır; Actions cache'i ise sayılmaz, depo başına ayrı 10 GB sınırı vardır.
# Bu iş **günlük** olarak:
#   1. eski artefaktları siler (varsayılan: 2 günden eski),
#   2. uzun süredir erişilmeyen cache'leri siler (varsayılan: 7 gün),
#   3. kalan cache'leri **bütçeye** (varsayılan: 8000 MB, en yeniler korunur) indirir; GitHub 10 GB'ı aşınca kendisi en eskileri atar, bütçe bunun altında kalır.
#
# Workflow'lar `target/` dahil cache'ler (iş türü ve hedef başına bir tane) ve `retention-days: 1` kullanır.
# Elle çalıştırma: Actions → "Actions depolama temizliği" → Run workflow.
on:
  schedule:
    # Her gün 03:17 UTC (TR 06:17) — yoğun olmayan saat.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      artifact_retention_days:
        description: "Bu günden eski artefaktlar silinir"
        required: false
        default: "2"
        type: string
      cache_retention_days:
        description: "Bu günden uzun süredir erişilmeyen cache'ler silinir"
        required: false
        default: "7"
        type: string
      cache_budget_mb:
        description: "Cache'ler için üst sınır (MB) — en yeni girdiler korunur"
        required: false
        # Üç `target/` cache'i (test, kapsam, arm64 sürüm derlemesi) birkaç GB tutar; GitHub'ın depo başına 10 GB sınırının altında kalınır.
        default: "8000"
        type: string

# En az yetki: yalnızca artefakt/cache silmek için yazma gerekir.
permissions:
  contents: read
  actions: write

concurrency:
  group: ci-storage-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prune:
    name: Eski artefakt ve cache'leri buda
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Artefakt ve cache temizliği
        uses: actions/github-script@v7
        env:
          ARTIFACT_RETENTION_DAYS: ${{ github.event_name == 'workflow_dispatch' && inputs.artifact_retention_days || '2' }}
          CACHE_RETENTION_DAYS: ${{ github.event_name == 'workflow_dispatch' && inputs.cache_retention_days || '7' }}
          CACHE_BUDGET_MB: ${{ github.event_name == 'workflow_dispatch' && inputs.cache_budget_mb || '8000' }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const DAY = 24 * 60 * 60 * 1000;
            const now = Date.now();
            const mb = (bytes) => `${(bytes / 1024 / 1024).toFixed(1)} MB`;
            // Sonsuz döngüye karşı üst sınır (100 sayfa × 100 kayıt).
            const MAX_PAGES = 100;

            const artifactCutoff = now - Number(process.env.ARTIFACT_RETENTION_DAYS) * DAY;
            const cacheCutoff = now - Number(process.env.CACHE_RETENTION_DAYS) * DAY;
            const cacheBudget = Number(process.env.CACHE_BUDGET_MB) * 1024 * 1024;

            // 1) Eski artefaktlar. Eşik gün cinsinden olduğu için **çalışan** bir koşunun
            //    artefaktlarına dokunulmaz (release/docker işleri aynı koşuda tüketir).
            //    Sayfalama açıkça yapılır: `github.paginate` + eşleme fonksiyonu bu GitHub
            //    Script sürümünde dizi yerine beklenmeyen bir biçim döndürüyor.
            const artifacts = [];
            for (let page = 1; page <= MAX_PAGES; page += 1) {
              const { data } = await github.rest.actions.listArtifactsForRepo({
                owner, repo, per_page: 100, page,
              });
              const batch = Array.isArray(data.artifacts) ? data.artifacts : [];
              artifacts.push(...batch);
              if (batch.length < 100) break;
            }

            let removedArtifacts = 0;
            let freedArtifactBytes = 0;
            for (const artifact of artifacts) {
              if (!artifact || !artifact.id || !artifact.created_at) continue;
              // Süresi dolmuş artefakt depolamada yer tutmaz ve silme isteği 404/410 döner.
              if (artifact.expired) continue;
              if (new Date(artifact.created_at).getTime() >= artifactCutoff) continue;
              // Tek bir başarısız silme (yarış, süresi o anda dolan artefakt) tüm temizliği durdurmasın.
              try {
                await github.rest.actions.deleteArtifact({ owner, repo, artifact_id: artifact.id });
              } catch (error) {
                core.warning(`artefakt ${artifact.id} silinemedi (${error.status ?? 'hata'}): ${error.message}`);
                continue;
              }
              removedArtifacts += 1;
              freedArtifactBytes += artifact.size_in_bytes || 0;
            }

            // 2) + 3) Cache'ler: en yeni erişilen önce gelir; bütçe dolana kadar yeniler
            //    korunur, kalanlar (ve süresi geçenler) silinir.
            const caches = [];
            for (let page = 1; page <= MAX_PAGES; page += 1) {
              const { data } = await github.rest.actions.getActionsCacheList({
                owner, repo, per_page: 100, page,
              });
              const batch = Array.isArray(data.actions_caches) ? data.actions_caches : [];
              caches.push(...batch);
              if (batch.length < 100) break;
            }
            caches.sort((a, b) => new Date(b.last_accessed_at) - new Date(a.last_accessed_at));
            let keptBytes = 0;
            let removedCaches = 0;
            let freedCacheBytes = 0;
            for (const cache of caches) {
              if (!cache || !cache.id) continue;
              const stale = new Date(cache.last_accessed_at).getTime() < cacheCutoff;
              const overBudget = keptBytes + (cache.size_in_bytes || 0) > cacheBudget;
              if (!stale && !overBudget) {
                keptBytes += cache.size_in_bytes || 0;
                continue;
              }
              try {
                await github.rest.actions.deleteActionsCacheById({ owner, repo, cache_id: cache.id });
              } catch (error) {
                core.warning(`cache ${cache.id} silinemedi (${error.status ?? 'hata'}): ${error.message}`);
                continue;
              }
              removedCaches += 1;
              freedCacheBytes += cache.size_in_bytes || 0;
            }

            await core.summary
              .addHeading('Actions depolama temizliği')
              .addTable([
                [{ data: 'Kalem', header: true }, { data: 'Silinen', header: true }, { data: 'Boşaltılan', header: true }],
                ['Artefakt', String(removedArtifacts), mb(freedArtifactBytes)],
                ['Cache', String(removedCaches), mb(freedCacheBytes)],
                ['Korunan cache', String(caches.length - removedCaches), mb(keptBytes)],
              ])
              .write();
            core.info(
              `artefakt: ${removedArtifacts} silindi (${mb(freedArtifactBytes)}) · ` +
              `cache: ${removedCaches} silindi (${mb(freedCacheBytes)}) · ` +
              `kalan cache ${mb(keptBytes)} / bütçe ${mb(cacheBudget)}`
            );
