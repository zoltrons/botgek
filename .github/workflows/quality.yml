name: Dependency audit and coverage
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit@0.22.2
      - run: cargo audit --deny warnings
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: llvm-tools-preview
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          # Depolama kotası (dahil 0,5 GB) hedef (`target/`) dizinlerini tutmaya yetmiyor:
          # yalnızca cargo kayıt defteri/git önbelleği alınır. Derleme yeniden yapılır ama
          # depolama **onlarca MB**'ta kalır (tek bir target cache'i 300-600 MB tutuyordu).
          cache-targets: "false"
          # Tüm işler tek paylaşımlı kayıt defteri cache'ini kullanır (bkz. build-release.yml).
          add-job-id-key: "false"
          shared-key: "rust-registry"
          # Yeni cache yalnızca ana dal/etiket çalışmalarında oluşturulur; PR'lar geri yükler.
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.6.16
      - run: cargo llvm-cov --locked --all-targets --lcov --output-path lcov.info
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov.info
          # Varsayılan 90 gün yerine 1 gün: kapsam raporu yalnızca koşu sonrası incelenir.
          retention-days: 1
