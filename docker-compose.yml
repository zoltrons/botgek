services:
  botgek:
    build:
      context: .
      dockerfile: Dockerfile
    # Veya GHCR üzerinden yayınlanan imajı kullanmak isterseniz:
    # image: ghcr.io/<kullanici_adiniz>/botgek:latest
    container_name: botgek
    restart: unless-stopped
    # Güvenlik: Container'ı root olmayan host standart kullanıcısı (1000:1000) ile çalıştırır:
    user: "1000:1000"
    ports:
      # WebUI port eşlemesi (.env içindeki WEB_PORT veya varsayılan 3000)
      - "${WEB_PORT:-3000}:${WEB_PORT:-3000}"
    env_file:
      - .env
    environment:
      # Kalıcı kayıt veritabanı (kart kayıtları: 🗑️ silme izni + AI koruması)
      - BOTGEK_DB_PATH=/app/data/botgek.db
    volumes:
      # WebUI üzerinden yapılan ayarların (modüller, roller) kalıcı olması için:
      - ./settings.json:/app/settings.json
      # Kalıcı kayıt veritabanı (container silinse/yeniden oluşturulsa da kayıtlar kalır):
      - botgek-data:/app/data
    # Raspberry Pi için kaynak sınırları (isteğe bağlı güvenlik önlemi)
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  # Kalıcı kayıt veritabanı (SQLite). Silmek isterseniz: docker volume rm botgek_botgek-data
  botgek-data:

